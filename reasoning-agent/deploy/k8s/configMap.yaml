apiVersion: v1
kind: ConfigMap
metadata:
  name: reasoning-agent-config
  namespace: multi-agent
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.agent-system.svc.cluster.local:9092"
  REASONING_INPUT_TOPIC: "reasoning-input-topic"
  REASONING_OUTPUT_TOPIC: "reassign-input-topic"
  DOCUMENTS_RAW_TOPIC: "documents.raw"
  REASONING_GROUP_ID: "reasoning-agent-group"
  AI_CORE_URL: "http://ai-core.multi-agent.svc.cluster.local:8081"
  AI_CORE_TIMEOUT: "30s"
  AI_CORE_ANALYZE_PATH: "/reasoning/analyze"
