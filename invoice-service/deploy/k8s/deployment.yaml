apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-service
  template:
    metadata:
      labels:
        app: invoice-service
    spec:
      containers:
        - name: invoice-service
          image: dokeryelmariki/invoice-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: invoice-service-config
            - secretRef:
                name: openai-secret
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: invoices-storage
              mountPath: /data/invoices
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: invoices-storage
          emptyDir: {}
