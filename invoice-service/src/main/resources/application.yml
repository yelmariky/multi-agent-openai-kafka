server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: invoice-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ia_insight}
    username: ${POSTGRES_USER:ia_insight}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Relances automatiques de factures impayées (dunning)
dunning:
  enabled: ${DUNNING_ENABLED:false}
  from: ${MAIL_FROM:noreply@ia-insightservices.fr}
  cron: ${DUNNING_CRON:0 0 8 * * *}
  frontend-url: ${DUNNING_FRONTEND_URL:http://localhost:3000}
keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8090}
  internal-url: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_BASE_URL:http://localhost:8090}}

openai:
  api-key: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
  embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:2000}
  retry:
    max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:4}
    base-backoff-ms: ${OPENAI_RETRY_BASE_BACKOFF_MS:1500}
    max-backoff-ms: ${OPENAI_RETRY_MAX_BACKOFF_MS:15000}

app:
  invoices:
    storage-path: ${AI_CORE_INVOICES_STORAGE_PATH:/tmp/invoices}

ai-core:
  company-name: ${AI_CORE_COMPANY_NAME:IA-INSIGHT}

management:
  endpoints:
    web:
      exposure:
        include: ["health", "prometheus"]
  metrics:
    tags:
      application: ${spring.application.name}
  # Le serveur mail ne conditionne jamais la disponibilité du service (panne SMTP = relances échouent proprement)
  health:
    mail:
      enabled: false

logging:
  level:
    "[io.multiagent.invoice]": DEBUG
