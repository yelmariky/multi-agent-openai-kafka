server.port=8082
spring.application.name=note-frais-service

# PostgreSQL + pgvector
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/iainsight}
spring.datasource.username=${POSTGRES_USER:pgadmin}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/ia-insight/protocol/openid-connect/certs}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

AI_CORE_COMPANY_NAME=${AI_CORE_COMPANY_NAME:IA-INSIGHT}

# OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
openai.retry.max-attempts=4
openai.retry.base-backoff-ms=1500
openai.retry.max-backoff-ms=15000

# RAG / km
ai-core.expense.km-rate-7cv=0.661
ai-core.expense.km-annual=11000
ai-core.expense.km-per-day=50
ai-core.company-name=${AI_CORE_COMPANY_NAME:IA-INSIGHT}
ai-core.reference-date=

# OCR
ai-core.ocr.tesseract-command=tesseract
ai-core.ocr.pdftoppm-command=pdftoppm
ai-core.ocr.lang=eng+fra
ai-core.ocr.dpi=300
ai-core.ocr.storage-path=/tmp/receipts

# Monthly location scheduler
ai-core.monthly-location.enabled=true
ai-core.monthly-location.text=je loue pour la domiciliation a 450 EUR ce mois-ci

# Rewrite model
ai-core.openai.rewrite-model=gpt-4o-mini
ai-core.openai.embedding-model=text-embedding-3-small

# Caffeine
caffeine.spec=maximumSize=3000,expireAfterWrite=10m

# Prompts — must be provided via environment variables or ConfigMap
AI_CORE_PROMPT_SINGLE_EXPENSE=${AI_CORE_PROMPT_SINGLE_EXPENSE:}
AI_CORE_PROMPT_EXPENSE_LIST=${AI_CORE_PROMPT_EXPENSE_LIST:}
AI_CORE_PROMPT_INVOICE=${AI_CORE_PROMPT_INVOICE:}
AI_CORE_PROMPT_REWRITE_SYSTEM=${AI_CORE_PROMPT_REWRITE_SYSTEM:}
AI_CORE_PROMPT_OCR_SINGLE_EXPENSE=${AI_CORE_PROMPT_OCR_SINGLE_EXPENSE:}
