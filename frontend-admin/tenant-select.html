<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choisir une organisation — Admin</title>
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1017; --card: #111725; --accent: #2ce5a7; --accent-2: #7ad7ff;
      --text: #ecf1ff; --muted: #a8b3c6; --border: #1f2a3f;
      --font: 'Space Grotesk', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font); color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(44,229,167,.13), transparent 34%),
        radial-gradient(circle at 82% 4%,  rgba(122,215,255,.11), transparent 30%),
        var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%; max-width: 520px;
    }
    .brand {
      text-align: center; margin-bottom: 40px;
    }
    .brand-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(44,229,167,.18), rgba(122,215,255,.12));
      border: 1px solid rgba(44,229,167,.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 22px;
    }
    .brand h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    .brand p  { font-size: 13px; color: var(--muted); margin: 0; }

    /* Recent tenants */
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 10px;
    }
    .tenant-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
    .tenant-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      cursor: pointer; transition: border-color .15s, background .15s;
      text-decoration: none; color: inherit;
    }
    .tenant-card:hover { border-color: var(--accent); background: rgba(44,229,167,.05); }
    .tenant-avatar {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #0d1017;
    }
    .tenant-card-info { flex: 1; min-width: 0; }
    .tenant-card-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tenant-card-slug { font-size: 12px; color: var(--muted); font-family: monospace; }
    .tenant-card-arrow {
      color: var(--muted); transition: color .15s; flex-shrink: 0;
    }
    .tenant-card:hover .tenant-card-arrow { color: var(--accent); }

    /* Manual entry */
    .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .input-row { display: flex; gap: 8px; }
    .slug-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: monospace;
      font-size: 14px; padding: 10px 14px; outline: none;
      transition: border-color .15s;
    }
    .slug-input:focus { border-color: var(--accent); }
    .slug-input::placeholder { color: var(--muted); font-family: var(--font); }
    .btn-go {
      background: var(--accent); color: #0d1017; font-family: var(--font);
      font-size: 13px; font-weight: 700; border: none; border-radius: 10px;
      padding: 10px 20px; cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
    }
    .btn-go:hover { opacity: .88; }
    .empty-hint { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">

    <div class="brand">
      <img src="logo-mark.svg" alt="IA-INSIGHT" width="52" height="52" style="display:block;margin:0 auto 16px">
      <h1>Console Admin</h1>
      <p>Sélectionnez votre organisation pour continuer</p>
    </div>

    <!-- Recent tenants -->
    <div id="recent-section">
      <p class="section-label">Organisations récentes</p>
      <div id="tenant-cards" class="tenant-cards"></div>
    </div>

    <div class="divider"><span>ou accéder directement</span></div>

    <div class="input-row">
      <input id="slug-input" class="slug-input" type="text"
        placeholder="ex : ia-insight" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn-go" id="go-btn">Accéder →</button>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'recent_tenants';
    const COLORS = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#14b8a6'];

    function avatarColor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
      return COLORS[Math.abs(h) % COLORS.length];
    }

    function initials(name) {
      const parts = (name || '').trim().split(/\s+/);
      return parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : (name || '?').substring(0, 2).toUpperCase();
    }

    function loadRecent() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function renderCards(tenants) {
      const section = document.getElementById('recent-section');
      const container = document.getElementById('tenant-cards');
      if (!tenants.length) {
        section.style.display = 'none';
        return;
      }
      container.innerHTML = tenants.map(t => `
        <a class="tenant-card" href="/${encodeURIComponent(t.slug)}/">
          <div class="tenant-avatar" style="background:${avatarColor(t.name || t.slug)}">
            ${initials(t.name || t.slug)}
          </div>
          <div class="tenant-card-info">
            <div class="tenant-card-name">${t.name || t.slug}</div>
            <div class="tenant-card-slug">${t.slug}</div>
          </div>
          <div class="tenant-card-arrow">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </a>`).join('');
    }

    function navigate() {
      const slug = document.getElementById('slug-input').value.trim().toLowerCase()
        .replace(/[^a-z0-9-]/g, '-').replace(/^-+|-+$/g, '');
      if (!slug) return;
      window.location.href = `/${slug}/`;
    }

    document.getElementById('go-btn').addEventListener('click', navigate);
    document.getElementById('slug-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') navigate();
    });

    renderCards(loadRecent());
  </script>
</body>
</html>
