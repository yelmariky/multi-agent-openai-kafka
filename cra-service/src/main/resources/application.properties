server.port=8084
spring.application.name=cra-service

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/iainsight}
spring.datasource.username=${POSTGRES_USER:pgadmin}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/ia-insight/protocol/openid-connect/certs}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
