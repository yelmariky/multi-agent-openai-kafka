server.port=8084
spring.application.name=cra-service

weaviate.scheme=http
weaviate.host=${WEAVIATE_HOST:localhost:8080}
weaviate.class.cra=CRA

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/ia-insight/protocol/openid-connect/certs}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
