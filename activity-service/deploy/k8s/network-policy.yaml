# NetworkPolicy — Isolation réseau pour activity-service
# Seul Kong (namespace 'gateway') peut appeler activity-service en HTTP.
# Tout autre pod (même dans le cluster) est bloqué au niveau réseau K8s.
# Prérequis : le CNI doit supporter NetworkPolicy (Calico, Cilium, Weave).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: activity-service-ingress
  namespace: multi-agent
spec:
  podSelector:
    matchLabels:
      app: activity-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Autoriser uniquement Kong (namespace gateway)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8085
  egress:
    # Kafka (production cra.submitted / cra.validated / cra.refused)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-system
      ports:
        - protocol: TCP
          port: 9092
    # Keycloak (validation JWT)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # PostgreSQL (namespace db)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
      ports:
        - protocol: TCP
          port: 5432
    # DNS K8s (obligatoire pour toute résolution de nom de service)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
