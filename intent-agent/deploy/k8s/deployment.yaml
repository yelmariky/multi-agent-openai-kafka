apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-agent
  namespace: multi-agent
  labels:
    app: intent-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intent-agent
  template:
    metadata:
      labels:
        app: intent-agent
    spec:
      containers:
        - name: intent-agent
          image: dokeryelmariki/intent-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: intent-agent-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: intent-agent
  namespace: multi-agent
spec:
  selector:
    app: intent-agent
  ports:
    - name: http
      port: 8082
      targetPort: 8082
