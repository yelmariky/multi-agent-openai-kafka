apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: dokeryelmariki/notification-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.agent-system.svc.cluster.local:9092
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: multi-agent
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
