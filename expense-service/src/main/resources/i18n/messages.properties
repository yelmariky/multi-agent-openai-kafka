# Textes utilisateur — français (langue par défaut).
# MessageFormat : {0}, {1}… = valeurs dynamiques ; une apostrophe s'écrit '' (doublée).
# Ajouter une langue : copier ce fichier en messages_<code>.properties et l'ajouter à AI_CORE_TEXT_LOCALES.

# ── Saisie texte / raisonnement ────────────────────────────────────────────────
reasoning.error.emptyText=Texte vide.
reasoning.error.classificationFailed=Classification échouée - veuillez reformuler votre demande ou réessayer.

# ── Notes de frais : erreurs ───────────────────────────────────────────────────
expense.error.llmUnavailable=Le service LLM est temporairement indisponible. Pour les frais kilométriques, reformulez ainsi : ''44 km aller-retour domicile-bureau par jour juin''.
expense.error.noValidExpense=Le LLM n''a pas pu extraire de dépense valide à partir du texte fourni.
expense.error.receiptRequired=Un justificatif (photo ou PDF de la facture) est requis pour ce type de dépense. Utilisez le bouton d''envoi de justificatif plutôt que la saisie texte seule.
expense.error.duplicate=Une note de frais identique (même type, montant et description) existe déjà pour ce jour — évitez les doublons.
expense.error.companyMissing=Société/organisation manquante : indiquez le nom ou configurez AI_CORE_COMPANY_NAME
expense.error.negativeAmount=Montant négatif détecté ({0}€) — veuillez vérifier le montant saisi.
expense.error.excessiveAmount=Montant excessif détecté ({0}€ > {1}€ max par dépense). Pour des montants importants, contactez votre gestionnaire.
expense.error.futureDate=Date future détectée ({0}) — une note de frais ne peut pas être dans le futur.
expense.error.tooOld=Date trop ancienne ({0}) — les dépenses de plus de 2 ans ne sont pas acceptées.
expense.error.noVehicle=Votre profil n’indique aucun véhicule personnel. Les frais kilométriques ne peuvent pas être remboursés sans véhicule. Si vous utilisez les transports en commun, soumettez votre abonnement de transport en précisant le montant de votre carte ou pass mensuel.
expense.error.kmAfterTransportCard=Vous avez déjà enregistré un remboursement de carte de transport ce mois-ci ({0}). Il n’est pas possible de cumuler frais kilométriques et carte de transport sur le même mois.
expense.error.transportCardAfterKm=Vous avez déjà des frais kilométriques enregistrés ce mois-ci ({0}). Il n’est pas possible de cumuler frais kilométriques et carte de transport sur le même mois.
expense.error.reportCompanyRequired=Le nom de société / organisation est requis pour générer un rapport.

