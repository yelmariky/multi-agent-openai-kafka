server:
  port: 8082

spring:
  application:
    name: expense-service
  messages:
    basename: i18n/messages   # textes utilisateur — voir io.multiagent.expense.i18n.Messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true   # apostrophes doublées ('') dans tous les fichiers
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ia_insight}
    username: ${POSTGRES_USER:ia_insight}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false   # ai-service owns the schema
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  mvc:
    async:
      # Défaut Spring (30s) trop court : le retry Groq seul peut consommer ~22s
      # (voir LLMAIClient — 4 tentatives, backoff exponentiel) avant même de basculer
      # sur le fallback OpenAI, qui a lui-même besoin de temps (+ OCR/Vision en amont
      # pour /receipts/upload). Sans marge, le fallback est tué par AsyncRequestTimeoutException
      # avant d'avoir pu répondre.
      request-timeout: ${SPRING_MVC_ASYNC_TIMEOUT_MS:60000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.agent-system.svc.cluster.local:9092}
    # Propagation du trace_id dans les en-têtes Kafka (producteur + consommateur)
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:expense-service-${HOSTNAME:local}}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8090}
  internal-url: ${KEYCLOAK_INTERNAL_URL:http://keycloak.keycloak.svc.cluster.local:8080}

openai:
  api-key: ${OPENAI_API_KEY}
  llm:
    api-key: ${OPENAI_LLM_API_KEY:}
    base-url: ${OPENAI_LLM_BASE_URL:}
  model: ${OPENAI_MODEL:llama-3.1-8b-instant}
  expense-model: ${OPENAI_EXPENSE_MODEL:openai/gpt-oss-120b}
  fallback-model: ${OPENAI_FALLBACK_MODEL:gpt-4.1-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
  embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:2000}
  retry:
    max-attempts: 4
    base-backoff-ms: 1500
    max-backoff-ms: 15000

expense:
  guard:
    max-chars: ${EXPENSE_GUARD_MAX_CHARS:4000}
    max-requests-per-minute: ${EXPENSE_GUARD_MAX_RPM:20}
    scope-fail-open: ${EXPENSE_GUARD_SCOPE_FAIL_OPEN:true}
  rag:
    min-similarity: ${EXPENSE_RAG_MIN_SIMILARITY:0.70}
  company-name: ${AI_CORE_COMPANY_NAME:}
  km-rate-7cv: 0.661
  km-annual: 4999

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://ai-service.multi-agent.svc.cluster.local:8081}

management:
  endpoints:
    web:
      exposure:
        include: ["prometheus", "health", "metrics"]
  # Sprint 6 — trace_id/span_id dans chaque log (Micrometer Tracing, aucun export de traces)
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    # Histogramme HTTP → latence p95 (alerte Prometheus > 1 s)
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

logging:
  level:
    "[io.multiagent.expense]": INFO
    "[org.apache.catalina.core.ContainerBase]": WARN
