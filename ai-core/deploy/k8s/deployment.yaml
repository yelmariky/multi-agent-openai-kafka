apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core
  namespace: multi-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-core
  template:
    metadata:
      labels:
        app: ai-core
    spec:
      containers:
      - name: ai-core
        image: dokeryelmariki/ai-core:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: multi-agent-config
        - secretRef:
            name: openai-secret
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
          - name: receipts-storage
            mountPath: /data/receipts
      volumes:
        - name: receipts-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-core
  namespace: multi-agent
spec:
  selector:
    app: ai-core
  ports:
  - port: 8081
    targetPort: 8081
