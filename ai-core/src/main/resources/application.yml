server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ai-core
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/ia-insight/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=1 : le leader confirme la réception (compromis perf/durabilité pour du best-effort)
      acks: 1
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: ["prometheus", "health", "metrics"]
  metrics:
    tags:
      application: ${spring.application.name}

openai:
  api-key: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
  retry:
    max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:4}
    base-backoff-ms: ${OPENAI_RETRY_BASE_BACKOFF_MS:1500}
    max-backoff-ms: ${OPENAI_RETRY_MAX_BACKOFF_MS:15000}

ai-core:
  openai:
    intent-model: ${AI_CORE_INTENT_MODEL:gpt-4o-mini}
    rewrite-model: ${AI_CORE_REWRITE_MODEL:gpt-4o-mini}
    rag-model: ${AI_CORE_RAG_MODEL:gpt-4o}
    embedding-model: ${AI_CORE_EMBED_MODEL:text-embedding-3-small}
  rag:
    top-k-search: ${AI_CORE_RAG_TOP_K_SEARCH:20}
    top-k-context: ${AI_CORE_RAG_TOP_K_CONTEXT:5}
  reference-date: ${AI_CORE_REFERENCE_DATE:}
  expense:
    km-per-day: ${AI_CORE_EXPENSE_KM_PER_DAY:56}
    km-rate-7cv: ${AI_CORE_EXPENSE_KM_RATE_7CV:0.661}
    km-annual: ${AI_CORE_EXPENSE_KM_ANNUAL:11000}
  company-name: ${AI_CORE_COMPANY_NAME:IA-INSIGHT}
  admin-key: ${AI_CORE_ADMIN_KEY:}
  monthly-location:
    enabled: ${MONTHLY_LOCATION_ENABLED:true}
    text: ${MONTHLY_LOCATION_TEXT:"je loue pour la domiciliation à 450 EUR ce mois-ci"}
  ocr:
    storage-path: ${AI_CORE_RECEIPTS_STORAGE_PATH:/tmp/receipts}
    tesseract-command: ${AI_CORE_OCR_TESSERACT_CMD:tesseract}
    pdftoppm-command: ${AI_CORE_OCR_PDFTOPPM_CMD:pdftoppm}
    lang: ${AI_CORE_OCR_LANG:eng+fra}
    dpi: ${AI_CORE_OCR_DPI:300}

weaviate:
  scheme: ${WEAVIATE_SCHEME:http}
  host: ${WEAVIATE_HOST:?WEAVIATE_HOST is required}
  class-name: ${WEAVIATE_CLASS:DocumentChunk}
  expense-class: ${WEAVIATE_EXPENSE_CLASS:Expense}
  schema-init:
    max-attempts: ${WEAVIATE_SCHEMA_INIT_MAX_ATTEMPTS:6}
    backoff: ${WEAVIATE_SCHEMA_INIT_BACKOFF:10s}

invoice:
  service:
    url: ${INVOICE_SERVICE_URL:http://invoice-service:8083}

notefrais:
  service:
    url: ${NOTEFRAIS_SERVICE_URL:http://note-frais-service:8082}

caffeine:
  spec: maximumSize=3000,expireAfterWrite=10m

logging:
  level:
    "[io.multiagent.core.service]": DEBUG
    # SSE broken pipe: connexion navigateur fermée — géré proprement, bruit inutile
    "[org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitterReturnValueHandler]": WARN
    "[org.apache.catalina.connector.ClientAbortException]": WARN
