server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ai-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ia_insight}
    username: ${POSTGRES_USER:ia_insight}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  # SMTP 100% externalisé — changer de fournisseur = modifier les MAIL_* du ConfigMap
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
    consumer:
      # Chaque pod reçoit TOUS les messages Kafka (groupId unique par instance).
      # Nécessaire car les SSE emitters sont en mémoire et non partagés entre pods.
      # ${HOSTNAME} = nom du pod K8s (ex: ai-core-5945cb94df-jg2kp) → unique par pod.
      group-id: ${KAFKA_CONSUMER_GROUP_ID:ai-core-notifications-${HOSTNAME:local}}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: ["prometheus", "health", "metrics"]
  metrics:
    tags:
      application: ${spring.application.name}

openai:
  api-key: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
  embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:2000}
  # LLM provider alternatif (Groq, Together.ai, Ollama…) — laisser vide pour rester sur OpenAI
  # Groq    : OPENAI_LLM_BASE_URL=https://api.groq.com/openai/v1
  # Hermes  : OPENAI_LLM_BASE_URL=https://api.together.xyz/v1
  # Ollama  : OPENAI_LLM_BASE_URL=http://ollama:11434/v1
  llm:
    base-url: ${OPENAI_LLM_BASE_URL:}
    api-key: ${OPENAI_LLM_API_KEY:}
  # Modèle OpenAI utilisé en fallback si le provider LLM principal (Groq) est indisponible
  fallback-model: ${OPENAI_FALLBACK_MODEL:gpt-4.1-mini}
  retry:
    max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:4}
    base-backoff-ms: ${OPENAI_RETRY_BASE_BACKOFF_MS:1500}
    max-backoff-ms: ${OPENAI_RETRY_MAX_BACKOFF_MS:15000}

ai-core:
  openai:
    intent-model: ${AI_CORE_INTENT_MODEL:gpt-4.1-mini}
    rewrite-model: ${AI_CORE_REWRITE_MODEL:gpt-4.1-mini}
    rag-model: ${AI_CORE_RAG_MODEL:gpt-4o}
    embedding-model: ${AI_CORE_EMBED_MODEL:text-embedding-3-large}
  rag:
    top-k-search: ${AI_CORE_RAG_TOP_K_SEARCH:20}
    top-k-context: ${AI_CORE_RAG_TOP_K_CONTEXT:5}
    # OWASP LLM08 — chunks sous ce seuil cosine ignorés (protection embeddings adversariaux)
    min-similarity: ${AI_CORE_RAG_MIN_SIMILARITY:0.70}
  reference-date: ${AI_CORE_REFERENCE_DATE:}
  expense:
    km-per-day: ${AI_CORE_EXPENSE_KM_PER_DAY:56}
    km-rate-7cv: ${AI_CORE_EXPENSE_KM_RATE_7CV:0.661}
    km-annual: ${AI_CORE_EXPENSE_KM_ANNUAL:11000}
  company-name: ${AI_CORE_COMPANY_NAME:IA-INSIGHT}
  admin-key: ${AI_CORE_ADMIN_KEY:}
  guard:
    max-chars: ${AI_CORE_GUARD_MAX_CHARS:4000}
    max-requests-per-minute: ${AI_CORE_GUARD_MAX_RPM:20}
    # OWASP LLM01 — comportement si le LLM guard est indisponible
    # true (défaut) = fail-open : la requête passe, protégée par les regex PromptGuard
    # false = fail-closed : bloquer systématiquement (plus sûr mais réduit la disponibilité)
    # Passer à false en prod uniquement quand la disponibilité LLM est garantie (SLA >= 99.9%)
    scope-fail-open: ${AI_CORE_GUARD_SCOPE_FAIL_OPEN:true}
  monthly-location:
    enabled: ${MONTHLY_LOCATION_ENABLED:true}
    text: ${MONTHLY_LOCATION_TEXT:"je loue pour la domiciliation à 450 EUR ce mois-ci"}
  cra-reminder:
    enabled: ${CRA_REMINDER_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@example.com}}
    frontend-url: ${FRONTEND_CONSULTANT_URL:http://localhost:3001}
  ocr:
    storage-path: ${AI_CORE_RECEIPTS_STORAGE_PATH:/tmp/receipts}
    tesseract-command: ${AI_CORE_OCR_TESSERACT_CMD:tesseract}
    pdftoppm-command: ${AI_CORE_OCR_PDFTOPPM_CMD:pdftoppm}
    lang: ${AI_CORE_OCR_LANG:eng+fra}
    dpi: ${AI_CORE_OCR_DPI:300}

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8090}
  internal-url: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_BASE_URL:http://localhost:8090}}

invoice:
  service:
    url: ${INVOICE_SERVICE_URL:http://invoice-service:8083}

caffeine:
  spec: maximumSize=3000,expireAfterWrite=10m

logging:
  level:
    "[io.multiagent.core.service]": DEBUG
    # SSE broken pipe: connexion navigateur fermée — géré proprement, bruit inutile
    "[org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitterReturnValueHandler]": WARN
    "[org.apache.catalina.connector.ClientAbortException]": WARN
    "[org.apache.catalina.core.ContainerBase]": WARN
