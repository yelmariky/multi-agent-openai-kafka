apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-service-receipts
  namespace: multi-agent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: dokeryelmariki/ai-service:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: multi-agent-config
        - secretRef:
            name: openai-secret
        - secretRef:
            name: postgres-secret
        env:
          - name: AI_CORE_OCR_STORAGE_PATH
            value: /data/receipts
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
          - name: receipts-storage
            mountPath: /data/receipts
      volumes:
        - name: receipts-storage
          persistentVolumeClaim:
            claimName: ai-service-receipts
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: multi-agent
spec:
  selector:
    app: ai-service
  ports:
  - port: 8081
    targetPort: 8081
