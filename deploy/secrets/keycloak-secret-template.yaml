# Template de Secret Keycloak — NE PAS COMMITTER avec de vraies valeurs.
# Ce fichier sert de référence pour créer le secret manuellement ou via install.sh.
#
# Pour créer le secret en base64 :
#   echo -n "admin" | base64
#   echo -n "monMotDePasse" | base64
#
# Ou utiliser le script deploy/keycloak/install.sh qui crée ce secret depuis les variables d'env :
#   export KEYCLOAK_ADMIN=admin
#   export KEYCLOAK_ADMIN_PASSWORD=monMotDePasse
#   ./deploy/keycloak/install.sh
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: ia-insight-platform
type: Opaque
data:
  # Remplacer par : echo -n "<admin-username>" | base64
  KEYCLOAK_ADMIN: REPLACE_WITH_BASE64_ADMIN_USERNAME
  # Remplacer par : echo -n "<admin-password>" | base64
  KEYCLOAK_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ADMIN_PASSWORD
