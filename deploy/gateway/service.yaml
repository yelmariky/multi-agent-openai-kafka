# Service ClusterIP pour le proxy Kong — point d'entrée interne au cluster
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: gateway
  labels:
    app: kong
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# Service ClusterIP pour l'Admin API Kong — réservé aux ops, ne pas exposer en prod
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: gateway
  labels:
    app: kong
spec:
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
# Service NodePort pour accès dev local — les deux frontends pointent ici
# Accès : http://localhost:30000
# En prod : remplacer par un LoadBalancer ou un Ingress
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-nodeport
  namespace: gateway
  labels:
    app: kong
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30000
  type: NodePort
