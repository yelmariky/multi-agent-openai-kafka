# Kafka KRaft Configuration - 3 Combined Nodes (Broker + Controller)
# Version: 4.1.0

kafka:
  enabled: true
  
  # Image configuration
  image:
    repository: confluentinc/cp-kafka
    tag: 7.7.0  # Latest stable version with KRaft support
    pullPolicy: IfNotPresent
  
  # KRaft mode (no Zookeeper)
  kraft:
    enabled: true
  
  # 3 replicas - each node is both broker and controller
  replicas: 3
  
  # Resource allocation - balanced for production use
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  # Persistent storage - 20GB per node
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""  # Use default storage class
    accessModes:
      - ReadWriteOnce
  
  # Kafka configuration
  config:
    # Performance tuning
    num.network.threads: "8"
    num.io.threads: "8"
    socket.send.buffer.bytes: "102400"
    socket.receive.buffer.bytes: "102400"
    socket.request.max.bytes: "104857600"
    
    # Log settings
    log.dirs: "/var/lib/kafka/data"
    num.partitions: "3"
    default.replication.factor: "3"
    min.insync.replicas: "2"
    
    # Log retention
    log.retention.hours: "168"  # 7 days
    log.retention.bytes: "1073741824"  # 1GB per partition
    log.segment.bytes: "1073741824"
    
    # Compression
    compression.type: "producer"
    
    # Transaction settings
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    
    # Offsets topic settings
    offsets.topic.replication.factor: "3"
    offsets.topic.num.partitions: "50"
  
  # Combined mode: each node is both controller and broker
  processRoles: "broker,controller"
  
  # Service configuration
  service:
    type: ClusterIP
    ports:
      client: 9092
      controller: 9093
      internal: 9094
  
  # Health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # Security
  allowPlaintextListener: true
  
  # JVM settings optimized for 2-4GB memory
  heapOpts: "-Xms1536m -Xmx1536m"
  
  # Pod disruption budget for high availability
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  
  # Anti-affinity to spread pods across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - kafka
            topologyKey: kubernetes.io/hostname
