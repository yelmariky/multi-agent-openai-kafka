---
# StorageClass sans provisionnement dynamique — liaisons PV/PVC statiques
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain

---
# PV pour kafka-0 → /Users/younes/data/kafka/kafka-0
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv-0
  labels:
    app: kafka
    node: "0"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka-hostpath
  claimRef:
    namespace: agent-system
    name: data-kafka-0
  hostPath:
    path: /Users/younes/data/kafka/kafka-0
    type: DirectoryOrCreate


# kafka-1 et kafka-2 : plus de PV déclarés — cluster Kafka passé en mono-nœud (kafka-0 uniquement,
# voir deploy/kafka/statefulset.yaml). Si les objets PV kafka-pv-1/kafka-pv-2 existent encore dans
# le cluster (créés avant ce changement), ils sont orphelins et peuvent être supprimés :
#   kubectl delete pv kafka-pv-1 kafka-pv-2
