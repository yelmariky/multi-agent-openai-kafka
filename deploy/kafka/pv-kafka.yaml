---
# StorageClass sans provisionnement dynamique — liaisons PV/PVC statiques
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain

---
# PV pour kafka-0 → /Users/younes/data/kafka/kafka-0
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv-0
  labels:
    app: kafka
    node: "0"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka-hostpath
  claimRef:
    namespace: agent-system
    name: data-kafka-0
  hostPath:
    path: /Users/younes/data/kafka/kafka-0
    type: DirectoryOrCreate

---
# PV pour kafka-1 → /Users/younes/data/kafka/kafka-1
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv-1
  labels:
    app: kafka
    node: "1"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka-hostpath
  claimRef:
    namespace: agent-system
    name: data-kafka-1
  hostPath:
    path: /Users/younes/data/kafka/kafka-1
    type: DirectoryOrCreate

---
# PV pour kafka-2 → /Users/younes/data/kafka/kafka-2
