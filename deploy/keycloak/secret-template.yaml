# Template de Secret Keycloak — NE PAS COMMITTER avec de vraies valeurs.
# Les valeurs en base64 ci-dessous sont des placeholders (chaînes vides encodées).
# Générer les vraies valeurs :
#   echo -n "admin" | base64          → KEYCLOAK_ADMIN
#   echo -n "monMotDePasse" | base64  → KEYCLOAK_ADMIN_PASSWORD
#
# Ou utiliser le script install.sh qui crée ce secret depuis les variables d'env.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: keycloak
  labels:
    app: keycloak
type: Opaque
data:
  # Remplacer par : echo -n "<admin-username>" | base64
  KEYCLOAK_ADMIN: REPLACE_WITH_BASE64_ADMIN_USERNAME
  # Remplacer par : echo -n "<admin-password>" | base64
  KEYCLOAK_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ADMIN_PASSWORD
