# Deployment Keycloak 24.0.2 en mode start-dev (K8s local / dev)
# En production : remplacer KC_DB=dev-file par une vraie base (PostgreSQL) et mode=start
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: ia-insight-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # initContainer root qui chown le répertoire data avant le démarrage de Keycloak
      # Nécessaire car le PVC hostPath est créé avec les droits root,
      # mais Keycloak tourne en uid 1000 et ne peut pas créer /opt/keycloak/data/h2/
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'chown -R 1000:1000 /opt/keycloak/data && chmod 755 /opt/keycloak/data']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.2
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Credentials admin — injectés depuis le Secret keycloak-secret
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Base de données fichier pour dev (pas de PostgreSQL requis)
            - name: KC_DB
              value: "dev-file"
            # Désactiver la vérification stricte du hostname pour K8s local
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # HTTP activé (TLS géré par Istio en mTLS ou par l'ingress)
            - name: KC_HTTP_ENABLED
              value: "true"
            # Active le management interface sur port 9000 (health endpoints)
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            # Données Keycloak persistées (base H2 dev-file, config runtime)
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            # Realm importé au démarrage depuis le ConfigMap
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # Thème IA-INSIGHT — theme.properties
            - name: theme-ia-insight
              mountPath: /opt/keycloak/themes/ia-insight/login/theme.properties
              subPath: theme.properties
              readOnly: true
            # Thème IA-INSIGHT — login.css
            - name: theme-ia-insight
              mountPath: /opt/keycloak/themes/ia-insight/login/resources/css/login.css
              subPath: login.css
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        # Volume persistant — données Keycloak survivent aux redémarrages
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-pvc
        - name: realm-config
          configMap:
            name: keycloak-realm-config
        - name: theme-ia-insight
          configMap:
            name: keycloak-theme-ia-insight
