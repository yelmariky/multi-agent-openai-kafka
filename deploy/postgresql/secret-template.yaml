# secret-template.yaml — NE PAS appliquer directement.
# Utilisé par install.sh qui injecte les valeurs depuis .env via kubectl create secret.
#
# Pour créer manuellement :
#   kubectl create secret generic postgres-secret \
#     --namespace=postgres \
#     --from-literal=POSTGRES_USER=pgadmin \
#     --from-literal=POSTGRES_PASSWORD=changeme \
#     --from-literal=POSTGRES_DB=iainsight \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: postgres
type: Opaque
stringData:
  POSTGRES_USER: "<POSTGRES_USER>"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  POSTGRES_DB: "<POSTGRES_DB>"
