[project]
name = "multiagent-mcp"
version = "1.0.0"
description = "MCP Server — Gestion des notes de frais et factures par société"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "expense", "invoice", "multiagent", "openai"]

dependencies = [
    "mcp[cli]>=1.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
multiagent-mcp = "multiagent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
